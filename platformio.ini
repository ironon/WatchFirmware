; PlatformIO Project Configuration File
[env:esp32-c3-devkitc-02]
; Pinned to the frozen official toolchain (Arduino-ESP32 2.0.17 / ESP-IDF 4.4.7).
; Bare `platform = espressif32` resolves to whatever is registered under that name
; globally — which the 2026-07 pioarduino spike hijacked (it installs its Arduino
; 3.x / IDF 5.x fork as "espressif32"). The watch stays on IDF 4.4.7 + Option A
; (see firmware_spec_v2.md §10.1 spike note), so pin the version explicitly.
platform = espressif32@6.9.0
board = esp32-c3-devkitc-02
framework = arduino
lib_deps =
    h2zero/NimBLE-Arduino@^2.0.0
    bblanchon/ArduinoJson@^7.0.0
    thijse/ArduinoLog@^1.1.1
    fastled/FastLED@^3.7.0
    symlink://../proximity_engine
    symlink://../beep_vocab
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DPROXIMITY_ROLE_WATCH
    ; nimble_host overflowed its stack on 2026-08-03 during the enforcement
    ; central connect, with SP just 16 bytes past the guard — the margin was
    ; already gone, and any extra host work tipped it. The proximate trigger (a
    ; second, redundant WiFi scan holding the coex arbiter while the phone link
    ; was still up) is fixed, but a task that close to its limit will find
    ; another way to fall over. NimBLE-Arduino's default is 4096.
    ;
    ; 6144 and not 8192: task stacks come out of the HEAP, and 8192 cost 6.2 KB
    ; of it (measured — free heap 11912 -> 5708 on the bench build). The watch
    ; runs close enough to empty that spending that much to fix a 16-byte
    ; overflow trades one failure mode for another.
    -DCONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE=6144

; Enable typing a full command and sending it when you press Enter
monitor_filters = send_on_enter

; Display the characters as you type them into the terminal
monitor_echo = yes

extra_scripts = pre:../proximity_engine/tools/inject_sha.py
